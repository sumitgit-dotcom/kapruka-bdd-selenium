name: Kapruka BDD CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox, edge]
      fail-fast: false # Continue to next browser even if one fails

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Run tests on ${{ matrix.browser }}
      run: mvn clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true

    - name: Upload Cucumber Report
      if: always() # Upload report even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-report-${{ matrix.browser }}
        path: target/cucumber-reports.html